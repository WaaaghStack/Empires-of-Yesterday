[package]
name = "empire_territory"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin gdext off floating `branch = "master"` (C13 / G1).
# Rev from Cargo.lock known-good: godot 0.5.3 @ 38154780a3aa959df50158959e2c04dbcacc9956
# (Godot 4.x including 4.6). Bump intentionally when upgrading gdext.
godot = { git = "https://github.com/godot-rust/gdext", rev = "38154780a3aa959df50158959e2c04dbcacc9956" }
rayon = "1.10"

[features]
default = []
# Enable if you need experimental thread safety features later
# experimental-threads = ["godot/experimental-threads"]
